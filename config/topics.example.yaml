  - name: Business Associate & Vendor Risk
    policy: Third-Party Risk
    owner: Third-Party Risk
    cadence: annual
    description: >-
      Due diligence, contracts and ongoing monitoring for vendors and
      business associates handling ePHI.
    nist_controls: [CA-3, SA-9, SR-1, SR-2, SR-6, SR-8]
    evidence:
      - Executed business associate agreements
      - Vendor security review records

  - name: Workforce Security Training
    policy: People
    owner: Security Awareness
    cadence: annual
    nist_controls: [AT-1, AT-2, AT-3, AT-4]
    evidence:
