# The topic POOL that `policyforge init` draws from, and a registry in its own
# right. `init` reads the scope facts under `programme:` in config/config.yaml
# (builds_software, own_facilities, personal_data, baseline, ai) and writes
# config/topics.yaml (gitignored) with the topics they call for, at most 25;
# set `owner` there to your own team names. Copying this file whole instead
# gives every topic below, which is past that ceiling.
#
# A topic is a coherent operational process that ONE team can comfortably own
# end to end. Cross-team steps are expected — user lifecycle touches HR, IAM,
# IT support and app owners — and that's still one topic, because one team
# owns the process and is accountable for the handoffs working. What breaks a
# topic is split *accountability*, not multiple contributors.
#
# `nist_controls` are anchors, not an exhaustive list: anchoring a control
# also claims its enhancements, so AC-2 covers AC-2(1)..AC-2(13) too. Anchor
# an enhancement directly only when it genuinely belongs to a different team
# than its parent — a direct claim beats an inherited one.
#
# An optional `confluence:` block records where a topic's documents are
# published, so one instruction can be applied across the whole set:
#
#     policyforge edit-topic --topic-name "Identity Lifecycle & Access Review" #         --instruction "Access reviews move from quarterly to monthly." #         --host https://yourco.atlassian.net/wiki
#
# Each page is planned separately and told which tier it is, so a cadence
# change lands in the Standard and the Procedure and leaves the Policy alone.
# Only the first topic below carries the block, as an example — add it to the
# others as you publish them. A Policy's page is declared on the Policy, under
# `policies:`, and not on a topic.
#
# Check your work with:
#     policyforge coverage --controls data/frameworks/nist-800-53-r5/controls.json --controls data/frameworks/nist-ai-rmf/controls.json --controls data/frameworks/hipaa-security-rule/controls.json --controls data/frameworks/hipaa-privacy-rule/controls.json --controls data/frameworks/hipaa-breach-notification-rule/controls.json --baseline moderate
#
# which reports controls no topic claims (orphaned) and controls two topics
# claim (contested). Roughly 25 topics is the practical ceiling; past that,
# processes start getting sliced apart and accountability blurs again.
#
# THIS FILE IS A POOL, NOT A STARTING REGISTRY. It ships more topics than any
# organisation should keep (33), so that the shapes are here to be recognised
# rather than invented from nothing. A topic you keep because it was in the
# example is worse than one you never had, because it owns requirements
# nobody is actually accountable for. How `init` picks, in order:
#
#   1. a topic is on when most reference structures name its area (the table
#      is in `policyforge.topics.convergence`; it is read by `init`, and no
#      document cites it);
#   2. a scope fact turns the conditional ones on: Secure Development for
#      builds_software, Physical & Environmental for own_facilities, Privacy
#      for personal_data pii or phi (and the two HIPAA topics for phi),
#      Personnel Security and System Maintenance for a baseline;
#   3. a topic that is off folds into its nearest core topic, whose owner
#      stays accountable, and `init` prints every fold;
#   4. `ai` sizes the AI topics: three for a user of AI (Responsible Use of AI
#      takes the categories the builder's other three hold), five for a
#      builder, and up to two more (Data for AI Systems and Transparency to
#      Affected People) while the ceiling has room. The three that appear
#      with a role carry no anchors here: `init` assigns the categories they
#      take from the topics that hold them in this file.
#
# An organisation that does no AI declares `ai: none`, and `/coverage` then
# leaves the AI RMF out of its numbers entirely and says so under the report,
# rather than counting 91 requirements against it that it never took on.

# Policies: one covers one or more Standards, and each Standard (a topic) names
# exactly one with `policy:`. A Policy is read by the whole organisation, so it
# states intent and scope and points to its Standards; the technical detail
# stays in them. About half as many Policies as Standards is the aim. The owner
# of a Policy is the accountable executive, who is often not a topic's owner.
# A Policy's page is declared HERE, not on each topic: several topics would
# otherwise claim one page. The executive titles below are examples to change.
policies:
  - name: Governance & Risk
    owner: Chief Information Security Officer
    cadence: annual
    description: How the security programme is run and how risk is assessed and accepted.
  - name: Access Control
    owner: Chief Information Security Officer
    cadence: annual
    description: Who may use which systems, how that is granted, reviewed and removed.
    # The Policy's page is declared here, on the Policy, and not on each topic
    # under it: the three would otherwise claim one page.
    confluence:
      space: SEC
      pages:
        policy: Access Control Policy
  - name: Network & Cryptography
    owner: Chief Information Security Officer
    cadence: annual
    description: How networks are separated and monitored, and how data is encrypted.
  - name: Operations Security
    owner: Chief Information Officer
    cadence: annual
    description: How systems are configured, patched, protected and maintained.
  - name: Monitoring & Incident
    owner: Chief Information Security Officer
    cadence: annual
    description: How activity is logged and watched, and how incidents are handled.
  - name: Continuity
    owner: Chief Operating Officer
    cadence: annual
    description: How the organisation backs up, restores and keeps working.
  - name: Data Protection & Privacy
    owner: Chief Privacy Officer
    cadence: annual
    description: How data is classified, handled, kept and disposed of, and how privacy is protected.
  - name: Third-Party Risk
    owner: Chief Risk Officer
    cadence: annual
    description: How vendors and business associates are chosen, contracted and watched.
  - name: People
    owner: Chief People Officer
    cadence: annual
    description: How workforce members are made aware of, and trained for, their security duties.
  - name: Physical
    owner: Vice President, Facilities
    cadence: annual
    description: How buildings, equipment and environments are protected.
  - name: Secure Development
    owner: Vice President, Engineering
    cadence: annual
    description: How software is built, reviewed and released securely.
  - name: AI Governance
    owner: Chief Risk Officer
    cadence: annual
    description: How AI systems are governed, assessed, measured and treated for risk.

topics:
  - name: Security Program Governance
    policy: Governance & Risk
    owner: Security Program / GRC
    cadence: annual
    description: >-
      Policy set, roles, program plan and the risk management strategy. Owned
      by the program rather than an engineering team — these are
      organizational obligations, not system ones.
    nist_controls: [PM-1, PM-2, PM-9, PL-1, PL-2, PL-4, PL-8, PL-10, PL-11,
                    SA-1, SA-2]
    evidence:
      - Approved policy set with review dates
      - Program plan and org chart

  - name: Risk Assessment & Authorization
    policy: Governance & Risk
    owner: Security Program / GRC
    cadence: annual
    description: >-
      System categorization, risk assessment, authorization and continuous
      monitoring strategy.
    nist_controls: [RA-1, RA-2, RA-3, RA-7, RA-9, CA-1, CA-2, CA-5, CA-6, CA-7, CA-8]
    evidence:
      - Risk register
      - Authorization decision record

  - name: Identity Lifecycle & Access Review
    policy: Access Control
    owner: IAM Engineering
    cadence: quarterly
    description: >-
      Joiner/mover/leaver, entitlement assignment and periodic access
      recertification. Spans HR, IAM and app owners; IAM owns the process.
    nist_controls: [AC-1, AC-2, AC-3, AC-5, AC-6, AC-14, IA-4, IA-12]
    evidence:
      - Identity provider user export
      - HR active-employee roster
      - Access review tickets with sign-off
    confluence:
      space: SEC
      pages:
        standard: Access Control Standard
        procedure: Access Review Procedure

  - name: Authentication & Credential Management
