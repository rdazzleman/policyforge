      - Phishing simulation results

  - name: Personnel Security
    policy: People
    owner: People Operations
    cadence: annual
    description: >-
      Position risk, screening, access agreements, transfers, termination
      and the sanctions process. On when an 800-53, FedRAMP or GovRAMP
      baseline applies, since PS-1 is a policy an assessor asks for;
      otherwise `init` folds it into Workforce Security Training.
    nist_controls: [PS-1, PS-2, PS-3, PS-4, PS-5, PS-6, PS-7, PS-8, PS-9]
    evidence:
      - Screening and access-agreement records
      - Termination and transfer checklists

  - name: Data Protection
    policy: Data Protection & Privacy
    owner: Data Governance
    cadence: annual
    description: >-
      Data classification, minimization and retention. Privacy (the PT
      family) is its own topic once the organisation handles personal data.
    nist_controls: [AC-21, SI-12, SI-18, PM-5]
    evidence:
      - Data inventory and classification register
      - Retention schedule

  - name: Privacy
    policy: Data Protection & Privacy
    owner: Privacy
    cadence: annual
    description: >-
      Processing authority, consent, notice and the privacy controls of
      800-53's PT family. On when `personal_data` is `pii` or `phi`;
      the HIPAA topics below add themselves for `phi`.
    nist_controls: [PT-1, PT-2, PT-3]
    evidence:
      - Record of processing and its authority
      - Privacy notices and consent records

  # ---- HIPAA Privacy and Breach Notification (45 CFR 164, subparts E and D) -
  #
  # These two anchor the rules' own sections, not 800-53 controls: NIST
  # publishes no mapping from either rule to 800-53, so a topic owns a
  # requirement of theirs by anchoring its section (`164.502` claims every
  # paragraph under it, as AC-2 claims AC-2(1)). Paragraphs a court vacated
  # (Purl v. HHS) are left out of `/coverage`'s count and named under it.
  # The Security Rule stays with the 800-53 topics above, through its own
  # crosswalk. Delete both if you handle no PHI: `/coverage` then leaves
  # both rules out of your numbers and says so under the report.

  # On when `programme.personal_data` is `phi` (22, part 3): `init` includes it then.
  - name: HIPAA Privacy Practices
    policy: Data Protection & Privacy
    owner: Privacy
    cadence: annual
    description: >-
      Uses and disclosures of PHI, the notice of privacy practices, and
      individuals' rights of access, amendment and accounting (45 CFR 164.500
      to 164.535).
    # Quoted: unquoted, YAML reads 164.510 as the number 164.51. 164.509 and
    # 164.535 are left out: a court vacated both whole sections (Purl v. HHS).
    nist_controls:
      [
        "164.500", "164.502", "164.504", "164.506", "164.508", "164.510", "164.512",
        "164.514", "164.520", "164.522", "164.524", "164.526", "164.528", "164.530",
        "164.532", "164.534",
      ]
    evidence:
      - Notice of privacy practices and its distribution record
      - Log of access, amendment and accounting requests, with response dates

  # On when `programme.personal_data` is `phi` (22, part 3): `init` includes it then.
  - name: Breach Notification
    policy: Data Protection & Privacy
    owner: Privacy
    cadence: annual
    description: >-
      Deciding whether an incident is a breach of unsecured PHI, and
      notifying individuals, the media and the Secretary (45 CFR 164.400 to
      164.414). Incident Response contributes the incident record and the
      timeline; Privacy owns the determination and the notices.
    nist_controls: ["164.400", "164.404", "164.406", "164.408", "164.410", "164.412", "164.414"]
    evidence:
      - Breach risk assessments, with the determination and who made it
      - Notice log: individuals, media, Secretary, with dates

  # ---- AI risk management (NIST AI RMF 1.0) --------------------------------
  #
  # Cut by PROCESS, not by the framework's four functions. A function-per-
  # topic split is the obvious move and this file's own rule forbids it:
  # "what breaks a topic is split accountability". Third-party AI is the
  # proof - it lives in Govern 6, Map 4 and Manage 3, one accountability
  # spread across three functions, so it is one topic here rather than a
  # third of each of three.
  #
  # These anchor AI RMF identifiers directly rather than 800-53 ones. The
  # AI RMF states OUTCOMES rather than obligations, so a document citing
  # `[NIST AI RMF Govern 1.1]` can be perfectly traceable and still commit
  # nobody to anything - read data/frameworks/nist-ai-rmf/README.md before
  # writing against these, and judge a draft by what someone would have to
  # do differently tomorrow.
  #
  # So a document generated from one of these topics describes OUTCOMES:
  # what good AI risk management looks like. It does not, by itself, tell
  # anyone what they must do. The obligations an AI programme draws on come
  # from the security topics above that own the 800-53 controls, for
  # example Security Program Governance, Risk Assessment & Authorization,
  # Secure Development Lifecycle, Workforce Security Training, Business
  # Associate & Vendor Risk and Incident Response. They are not anchored
  # here as well because every control has exactly one owning topic.
  #
  # PolicyForge does NOT claim those controls achieve the AI RMF outcomes.
  # NIST declined to make that claim, and there is deliberately no
  # crosswalk. Which obligations serve which outcome is your organisation's
  # decision (#188).

  - name: AI Governance & Accountability
    policy: AI Governance
    owner: AI Risk / GRC
    cadence: annual
    description: >-
      The AI policy set, who is accountable for what, the workforce and
      culture expectations around AI risk, and engagement with affected AI
      actors. Organizational obligations rather than system ones, which is
      why they sit with the programme and not with a model team.
    nist_controls: [Govern 1, Govern 2, Govern 3, Govern 4, Govern 5]
    evidence:
      - Approved AI policy set with review dates
      - AI accountability matrix (who signs off a deployment)
      - AI risk training completion records

  - name: AI System Inventory & Impact Assessment
    policy: AI Governance
    owner: AI Risk / Product
    cadence: per-system, reviewed quarterly
    description: >-
      Establishing what an AI system is for before it ships - context,
      categorization, claimed capabilities against benchmarks, and the
      impacts on people and communities. The process that produces the
      record everything downstream measures against.
    nist_controls: [Map 1, Map 2, Map 3, Map 5]
    evidence:
      - AI system inventory with categorization
      - Impact assessments, per system
      - Benchmark results against stated capability claims

  - name: AI Evaluation & Measurement
    policy: AI Governance
    owner: AI / ML Engineering
    cadence: per-release
    description: >-
      Choosing evaluation methods, evaluating systems for trustworthy
      characteristics, tracking identified risks over time, and asking
      whether the measurements are any good. Owned by the team that can
      actually run an evaluation.
    nist_controls: [Measure 1, Measure 2, Measure 3, Measure 4]
    evidence:
      - Evaluation plan and metric definitions per system
      - Evaluation results with dates and model versions
      - Record of measurement methods reviewed or retired

  - name: AI Risk Treatment & Incident Response
    policy: AI Governance
    owner: AI Risk / Incident Response
    cadence: continuous
    description: >-
      Prioritizing the risks MAP and MEASURE surfaced, deciding and
      documenting what is done about each, and responding, recovering and
      communicating when an AI system causes harm. Spans the model team and
      incident response; incident response owns the process.
    nist_controls: [Manage 1, Manage 2, Manage 4]
    evidence:
      - AI risk register with treatment decisions and owners
      - AI incident runbook
      - Post-incident reviews for AI-caused incidents

  # ---- Roles (22 part 3). Not anchored here: `init` gives them what they own. --
  #
  # An organisation that USES AI (`ai: user`) runs three AI topics, not five:
  # the Inventory and Impact, Evaluation and Risk Treatment topics fold into
  # this one, and it takes their categories. One that BUILDS AI (`ai: builder`)
  # has the five above, and up to two more that take one category each from
  # the topic it came out of (Map 4 from Third-Party AI, Map 5 from Inventory
  # and Impact), while the ceiling of 25 has room.
  - name: Responsible Use of AI
    policy: AI Governance
    owner: AI Risk / GRC
    cadence: annual
    description: >-
      How staff may use AI tools and systems the organisation did not build:
      what is approved, what may not be put into them, and who answers when
      it goes wrong. Feeds the acceptable use policy. For an organisation
      that uses AI rather than builds it, this topic also holds the AI RMF's
      Map, Measure and Manage categories.
    nist_controls: []
    evidence:
      - Register of approved AI tools and their permitted uses
      - Record of exceptions and incidents

  - name: Data for AI Systems
    policy: AI Governance
    owner: Data Governance
    cadence: annual
    description: >-
      Provenance, quality and rights for the data AI systems are trained,
      tuned and grounded on (ISO/IEC 42001 Annex A.7). Anchored at the AI RMF
      category level: Map 4 comes here from Third-Party AI & Data Supply Chain
      while this topic is on.
    nist_controls: []
    evidence:
      - Dataset register with provenance and licence

  - name: Transparency to Affected People
    policy: AI Governance
    owner: AI Risk / Product
    cadence: annual
    description: >-
      What people affected by an AI system's decisions are told, and how they
      can contest it (ISO/IEC 42001 Annex A.8). For an organisation whose AI
      decides about people. Anchored at the category level: Map 5 comes here
      from AI System Inventory & Impact Assessment while this topic is on.
    nist_controls: []
    evidence:
      - Notices given to affected people, and the contest process

  - name: Third-Party AI & Data Supply Chain
    policy: AI Governance
    owner: Vendor Risk / AI Risk
    cadence: per-vendor, reviewed annually
    description: >-
      AI risk that arrives with someone else's model, API, or training
      data - the policies that govern acquiring it, the mapping of what it
      brings, and the management of it in production. **One topic across
      three AI RMF functions on purpose:** the framework files this under
      Govern, Map and Manage separately, but one team is accountable for a
      vendor model end to end, and splitting it would split that.
    nist_controls: [Govern 6, Map 4, Manage 3]
    evidence:
      - Third-party AI inventory (models, APIs, datasets)
      - Vendor AI due-diligence records
      - Contractual terms covering model change and data use
