licence: public-domain
source: NIST AIRC (airc.nist.gov/docs/playbook.json), via policyforge etl-ai-rmf-playbook
notes: A US government work, so freely redistributable. NIST's suggested actions for each
  of the 72 AI RMF Core subcategories. THE PLAYBOOK IS VOLUNTARY - NIST's suggestions, which
  a document may say NIST suggests and never that NIST requires. Versioned separately from
  the Core, with no revision number of its own, so it is pinned to one export by the export's
  SHA-256 and a different export is refused. Carries no outcome wording - Control titles are
  PolicyForge's labels, and each outcome is read from nist-ai-rmf under the same id. Read
  README.md before citing this catalog.
