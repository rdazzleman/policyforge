notes: A US government work, so freely redistributable. Bundled with this project and safe
  to commit to any repository. REV 3 - the revision NIST publishes machine-readable. CMMC
  Level 2 currently assesses against R2, a different revision whose identifiers are shaped
  differently (3.1.1 there against 03.01.01 here), so a citation to this catalog is a citation
  to rev 3. Rev 3 publishes no Low/Moderate/High baseline profiles, so every control's baseline
  is empty - that is the source, not a parse that came up short. Read README.md before using
  this to prepare for a CMMC assessment.
