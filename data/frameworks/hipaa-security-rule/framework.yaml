# The unit the regulation names as a requirement, for document reach (80's
# ruling on #423): a standard. The catalog carries it as structure, each
# top-level entry a standard and its enhancements the standard's
# implementation specifications, so a change to 164.308(a)(1)(ii)(A)
# reaches a document citing 164.308(a)(1) or any of its specifications.
family: structure
# Where the catalog's structure and the regulation disagree. 164.314(a)(2)
# is "Implementation specifications (Required)" under the standard
# 164.314(a)(1), though the ETL made its three items top-level entries.
family_overrides:
  164.314(a)(2)(i): 164.314(a)(1)
  164.314(a)(2)(ii): 164.314(a)(1)
  164.314(a)(2)(iii): 164.314(a)(1)
# Nested in the catalog for structure only: 164.306(c) and (d) define
# "standards" and "implementation specifications"; they are not a standard
# and its specification, so (d) is its own family.
structure_only:
  - 164.306(d)
# Below a leaf (an id the catalog doesn't subdivide), a cited part stands only
# when the leaf's own text lists it as a list item (441; 80's 6235 rule 2 on
# #438). Switched on per catalog, with what it rests on.
leaf_parts: listed
leaf_parts_measured: >-
  2026-10-12 at release/1.8 937b6df5, with the loader fix that keeps a continuation paragraph's marker (441): 73 of 74 ids are leaves; in tests/fixtures/ecfr_45cfr164_subpart_c.xml, which parses to this catalog, all 26 paragraphs whose text joins a leaf keep their marker where the check reads it; the committed corpus and the user's fresh-corpus run (431 files, 2,517 distinct citations): 0 turned red
