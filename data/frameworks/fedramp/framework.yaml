notes: 'A US federal program''s own published rules, so freely redistributable. Bundled with
  this project and safe to commit to any repository.

  Tailoring, not a baseline. Nothing in this catalog says which controls a Low, Moderate or
  High system must implement. That selection was published as OSCAL profiles in GSA/fedramp-automation,
  which no longer exists, and no official machine-readable replacement has appeared — so `baseline`
  is left unset on every control here rather than guessed. What the catalog does carry is
  FedRAMP''s own two additions to the 79 controls it speaks to: the organization-defined values
  it has already decided, and the guidance it layers on top, joined onto the 800-53 text those
  controls tailor.'
