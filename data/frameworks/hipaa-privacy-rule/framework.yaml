      pre_rule_text: '(5) Implementation specification: Abuse, neglect, endangerment situations.
        Notwithstanding a State law or any requirement of this paragraph to the contrary,
        a covered entity may elect not to treat a person as the personal representative of
        an individual if: (i) The covered entity has a reasonable belief that: (A) The individual
        has been or may be subjected to domestic violence, abuse, or neglect by such person;
        or (B) Treating such person as the personal representative could endanger the individual;
        and (ii) The covered entity, in the exercise of professional judgment, decides that
        it is not in the best interest of the individual to treat the person as the individual''s
        personal representative.'
    '164.512':
      scope: statement
      ids:
      - '164.512'
      added_ids: []
      pre_rule_text: A covered entity may use or disclose protected health information without
        the written authorization of the individual, as described in § 164.508, or the opportunity
        for the individual to agree or object as described in § 164.510, in the situations
        covered by this section, subject to the applicable requirements of this section. When
        the covered entity is required by this section to inform the individual of, or when
        the individual may agree to, a use or disclosure permitted by this section, the covered
        entity's information and the individual's agreement may be given orally.
