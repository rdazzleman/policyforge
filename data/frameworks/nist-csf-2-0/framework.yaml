source: NIST usnistgov/oscal-content and NIST OLIR 186, via policyforge etl-csf
notes: A US government work, so freely redistributable. The CSF 2.0 Core - 6 functions, 22
  categories, 106 subcategories - with the 91 withdrawn CSF 1.1 elements excluded. THIS CATALOG
  STATES OUTCOMES RATHER THAN OBLIGATIONS, as the AI RMF Core does, so a citation to it supports
  no obligation on its own. It is reached through NIST's mapping to 800-53 (OLIR 186), which
  NIST publishes untyped and marks not comprehensive, so every link reads as partial coverage
  and an unmapped subcategory is not mapped by NIST, not without an 800-53 equivalent. Read
  README.md before citing this catalog.
crosswalk_relationship: source-untyped
