notes: A US government work, so freely redistributable. One criterion is one control, cited
  as 170.315(g)(10). Reserved and expired criteria are excluded and reported by id on every
  run. The live criteria must EQUAL a set two independent sources agree on (issue 179), because
  this catalog shipped once with fabricated criteria and was reverted (issues 152 and 163).
  Declared as "ONC Certification Criteria" rather than "45 CFR 170" because a framework name
  beginning with a digit is not a legal source tag. Read README.md before citing it.
