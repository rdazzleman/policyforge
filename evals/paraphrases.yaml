# Generated by asking the model for alternative phrasings of each
# routing case, then committed so the set is fixed and reviewable.
# The expected label is inherited from the case it came from: a
# rephrasing that changes the subject would be graded against the wrong
# answer, so the generator is told to keep the subject identical.
#
# The point is to measure paraphrase-invariance. A router that only
# works on the wording its author happened to think of is brittle, and
# nothing in the hand-written cases could reveal that.

orphaned-controls:
  expect: coverage
  phrasings:
  - unowned controls - which ones?
  - Could you please identify the controls that currently have no assigned owner?
  - hey which controls don't have anyone owning them?
  - wich controls dosent have an owner?
  - I need a list of all controls that lack an assigned owner.
  - We're doing a compliance review this quarter and I want to make sure nothing falls through the cracks
    — can you tell me which controls, if any, currently don't have anybody responsible for them?
coverage-obliquely:
  expect: coverage
  phrasings:
  - missing anything in the audit family?
  - Could you confirm whether the audit family is complete, or if there are any gaps we should address?
  - hey do u think we're missing something in the audit fam?
  - r we missing anythign in the audit familly?
  - I need to know if there are gaps in the audit family that we haven't covered yet.
  - So I was going through the audit family setup earlier and just wanted to double check with you — does
    it look like everything's there, or is something missing?
contested-ownership:
  expect: coverage
  phrasings:
  - any control double-claimed by two teams?
  - Could you confirm whether a single control point is being claimed by two separate teams?
  - hey does any control got claimed by like two teams at once?
  - is any contorl claimed by two teams?
  - I need to know if there's a control that two different teams are both claiming.
  - We're reviewing the match results and something looks off with the scoring — before we finalize, can
    you check if any control point ended up being claimed by two teams simultaneously?
undecided-parameters:
  expect: parameters
  phrasings:
  - org-defined values w/ no decision yet — count?
  - Could you please indicate the total number of organization-defined values for which a decision has
    not yet been made?
  - hey, how many of the org-defined values still don't have a decision made on them?
  - how amny org-defined vlaues still have no decsion?
  - I need the count of organization-defined values that currently lack an assigned decision.
  - We're reviewing the list of parameters that were left as organization-defined, and before moving forward
    I want to know exactly how many of those still remain undecided — no decision made yet.
catalog-changed:
  expect: drift
  phrasings:
  - catalog update - any changes?
  - Could you confirm whether any modifications were made when the catalog was updated?
  - hey did the catalog update actually change anything?
  - did anythng chnage when the catalog was updated?
  - I need to know what, if anything, changed as a result of the catalog update.
  - So we pushed that catalog update last week, and I'm trying to figure out for my report whether it
    actually altered anything or if it was basically a no-op — do you know if anything changed?
document-history:
  expect: history
  phrasings:
  - access control standard versions recorded?
  - Could you please provide a list of all versions of the access control standard that have been recorded?
  - hey what versions of the access control standard are on record?
  - wat versions of the acess control standrad have been recored?
  - I need to know which versions of the access control standard have been documented.
  - We're auditing our compliance docs and I want to make sure nothing's missing—so far, which versions
    of the access control standard have actually been recorded in the system?
tree-health:
  expect: check
  phrasings:
  - broken links in our docs?
  - Could you confirm whether any of our documents contain broken links between one another?
  - hey are any of our docs linking to stuff that's broken?
  - r there any borken links between our documents?
  - I need to know if there are broken links connecting our documents.
  - We've been reorganizing the file structure lately, and I'm worried some internal references might
    have gotten messed up in the process — can you check if any links between our documents are broken?
plain-document-question:
