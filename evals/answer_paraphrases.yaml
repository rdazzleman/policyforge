# Generated rewordings of selected answering questions, committed so the
# set is fixed and reviewable.
#
# Retrieval is pinned to the original wording: each case keeps the
# `retrieve` string its parent used, so the passages are identical
# across every phrasing and only the answering varies. Grading two
# stochastic stages at once would make a failure impossible to
# attribute.
#
# Expectations are inherited from the parent case in cases.yaml.

