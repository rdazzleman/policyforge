# Notice a framework update before an assessor does.
#
# NIST republishes the 800-53 OSCAL catalog without announcing it to you.
# The failure mode is silent: documents keep citing AC-2 while AC-2 quietly
# says something else, and nobody finds out until somebody reads both.
#
# This runs the ETL on a schedule and diffs the result against the committed
# catalog. A red build here is the notification, and the job log is the
# triage list — which controls moved, which of your topics and documents
# they reach, and which recorded parameter decisions were made against
# wording that has since changed.
#
# It writes nothing. Applying the update is a pull request somebody opens
# after reading the report, because deciding what a changed requirement
# means is the part that needs a person.
#
# Since #369 it also reports a reworded ENHANCEMENT (AC-2(3), a CFR
# paragraph) under its own id; before, only a control's own text and its
# list of enhancement ids were compared. The first run after that change can
# go red on upstream edits that were always there and never seen. That red
# is this job succeeding, not #369 breaking it: triage the list, do not
# loosen the check.
name: framework-drift

on:
  schedule:
    # Monthly. Catalog revisions are infrequent, and a job that cried wolf
    # weekly would be muted inside two months.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: check for a catalog update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          # Hashed, as in ci.yml.
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .

      # Overwrites the catalog in the working copy. Git still holds the
      # version that was committed, which is what `drift` compares against.
      - name: Fetch the current catalog
        run: policyforge etl-oscal

      # --fail-on-change is the point: a green build means nothing moved,
      # and a red one is the only notification anybody gets.
      - name: What changed, and what it reaches
        run: |
          policyforge drift \
            --controls data/frameworks/nist-800-53-r5/controls.json \
            --detail --fail-on-change

      # 45 CFR 171 moves on its own schedule, and by a different mechanism:
      # a rule change is published in the Federal Register and eCFR's
      # effective date moves. Subparts E-I are reserved, so this part has
      # room set aside to grow into — a new subpart would appear here as
      # added sections rather than as changed text.
      #
      # `if: always()` so a NIST change does not hide a Part 171 change.
      # Without it the first red step ends the job, and the month NIST
      # republishes is exactly a month nobody hears about this one.
      - name: Fetch the current information blocking rule
        if: always()
        run: policyforge etl-info-blocking

      - name: What changed in 45 CFR 171
        if: always()
        run: |
          policyforge drift \
            --controls data/frameworks/cfr-171-information-blocking/controls.json \
            --detail --fail-on-change

      - name: Fetch the current 42 CFR Part 2
        if: always()
        run: policyforge etl-part2

      - name: What changed in 42 CFR Part 2
        if: always()
        run: |
          policyforge drift \
            --controls data/frameworks/cfr-42-part-2-sud-records/controls.json \
            --detail --fail-on-change

      # Refused, not absorbed, when the criterion set moves: the loader's
      # live criteria must EQUAL an independently agreed set (#179). A red
      # step here after a new ONC rule is this job working -- a person
      # re-derives the set and re-pins; do not loosen the check.
      - name: Fetch the current ONC certification criteria
        if: always()
        run: policyforge etl-onc

      - name: What changed in 45 CFR 170.315
        if: always()
        run: |
          policyforge drift \
            --controls data/frameworks/cfr-170-315-onc-certification/controls.json \
            --detail --fail-on-change

      - name: Fetch the current AI RMF Core
        if: always()
        run: policyforge etl-ai-rmf

      - name: What changed in the NIST AI RMF
        if: always()
        run: |
          policyforge drift             --controls data/frameworks/nist-ai-rmf/controls.json             --detail --fail-on-change

      # The Playbook is pinned to one export by its SHA-256 (NIST publishes no
      # revision number), so when NIST re-publishes it the ETL REFUSES and
      # this step goes red. That is this job succeeding: a person reviews the
      # new export and re-pins. Do not "fix" the red by loosening the pin.
      - name: Fetch the current AI RMF Playbook
        if: always()
        run: policyforge etl-ai-rmf-playbook

      - name: What changed in the NIST AI RMF Playbook
        if: always()
        run: |
          policyforge drift \
            --controls data/frameworks/nist-ai-rmf-playbook/controls.json \
            --detail --fail-on-change

      - name: Fetch the current SP 800-171 rev 3
        if: always()
        run: policyforge etl-800-171

      - name: What changed in NIST SP 800-171
        if: always()
        run: |
          policyforge drift \
            --controls data/frameworks/nist-800-171-r3/controls.json \
            --detail --fail-on-change

      # Both CSF files are pinned by SHA-256, so a new edition of either is
      # refused before anything is written: that red is this job working.
      # The mapping's family links live in framework.yaml, which `drift`
      # does not read, so the refusal is what catches a change to them.
      - name: Fetch the current NIST CSF 2.0 and its OLIR 186 mapping
        if: always()
        run: policyforge etl-csf

      - name: What changed in NIST CSF 2.0
        if: always()
        run: |
          policyforge drift \
            --controls data/frameworks/nist-csf-2-0/controls.json \
            --detail --fail-on-change

      # Reads eCFR's CURRENT date, not the pin. It refuses, and goes red,
      # when the shape changes or the text Purl v. HHS vacated is not what
      # was pinned: eCFR finally removing it is this job working, and the
      # catalog then needs a deliberate re-pin and a README update.
      - name: Fetch the current HIPAA Privacy and Breach Notification Rules
        if: always()
        run: policyforge etl-hipaa-privacy --date latest

      - name: What changed in the HIPAA Privacy Rule
        if: always()
        run: |
          policyforge drift \
            --controls data/frameworks/hipaa-privacy-rule/controls.json \
            --detail --fail-on-change

      - name: What changed in the HIPAA Breach Notification Rule
        if: always()
        run: |
          policyforge drift \
            --controls data/frameworks/hipaa-breach-notification-rule/controls.json \
            --detail --fail-on-change
